<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="'Inter','Helvetica Neue','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="clDep" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#1A2230" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1280" height="960" fill="#FFFFFF"/>

  <!-- Title band -->
  <rect x="0" y="0" width="1280" height="56" fill="#0E3F8C"/>
  <text x="40" y="26" fill="#FFFFFF" font-size="20" font-weight="bold">LightCSR - Class Diagram</text>
  <text x="40" y="46" fill="#9FC3F0" font-size="13">8 classes | 2 DTO decoupling points | cross-layer calls via &#171;delegate&#187; / &#171;call&#187; | DTO flow via &#171;creates&#187; / &#171;consumes&#187;</text>

  <!-- ============ Tier labels (left margin) ============ -->
  <text x="20" y="164" fill="#0E3F8C" font-size="10" font-weight="bold">Controller</text>
  <text x="20" y="336" fill="#0E3F8C" font-size="10" font-weight="bold">Detection</text>
  <text x="20" y="352" fill="#0E3F8C" font-size="10" font-weight="bold">Retrieval</text>
  <text x="20" y="368" fill="#0E3F8C" font-size="10" font-weight="bold">Ranking</text>
  <text x="20" y="556" fill="#0E3F8C" font-size="10" font-weight="bold">Build</text>
  <text x="20" y="572" fill="#0E3F8C" font-size="10" font-weight="bold">Storage</text>
  <text x="20" y="606" fill="#0E3F8C" font-size="10" font-weight="bold">DTO layer</text>

  <!-- ============ Row 1: APIGateway (col B) ============ -->
  <g>
    <rect x="470" y="90" width="340" height="140" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" rx="4"/>
    <rect x="470" y="90" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="470" y="106" width="340" height="16" fill="#1E4FA8"/>
    <text x="640" y="112" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">APIGateway</text>
    <line x1="470" y1="122" x2="810" y2="122" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="480" y="146" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+router: Router</text>
    <text x="480" y="164" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+auth: AuthService</text>
    <text x="480" y="182" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+rate_limiter: TokenBucket</text>
    <line x1="470" y1="190" x2="810" y2="190" stroke="#D6DCE5" stroke-width="1"/>
    <text x="480" y="206" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+handle(req: Request): Response</text>
    <text x="480" y="222" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+validate_token(token: str): bool</text>
  </g>

  <!-- ============ Row 2: ColdStartDetector (col A) ============ -->
  <g>
    <rect x="90" y="290" width="340" height="140" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" rx="4"/>
    <rect x="90" y="290" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="90" y="306" width="340" height="16" fill="#1E4FA8"/>
    <text x="260" y="312" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">ColdStartDetector</text>
    <line x1="90" y1="322" x2="430" y2="322" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="100" y="346" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+threshold: int = 5</text>
    <text x="100" y="364" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+strategy: Strategy</text>
    <text x="100" y="382" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+history_window: int = 30</text>
    <line x1="90" y1="390" x2="430" y2="390" stroke="#D6DCE5" stroke-width="1"/>
    <text x="100" y="406" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+is_cold(user: User): bool</text>
    <text x="100" y="422" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+decide(user: User): Strategy</text>
  </g>

  <!-- ============ Row 2: RetrievalModule (col B) ============ -->
  <g>
    <rect x="470" y="290" width="340" height="160" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" rx="4"/>
    <rect x="470" y="290" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="470" y="306" width="340" height="16" fill="#1E4FA8"/>
    <text x="640" y="312" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">RetrievalModule</text>
    <line x1="470" y1="322" x2="810" y2="322" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="480" y="346" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+index_l1: FAISS</text>
    <text x="480" y="364" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+index_l2: KGIndex</text>
    <text x="480" y="382" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+topk: int = 20</text>
    <line x1="470" y1="390" x2="810" y2="390" stroke="#D6DCE5" stroke-width="1"/>
    <text x="480" y="406" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+retrieve(q: Query, k: int): List[Candidate]</text>
    <text x="480" y="422" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+expand(cands: List[Candidate],</text>
    <text x="530" y="438" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">k: int): List[Candidate]</text>
  </g>

  <!-- ============ Row 2: LightCSRRanker (col C) ============ -->
  <g>
    <rect x="850" y="290" width="340" height="160" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" rx="4"/>
    <rect x="850" y="290" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="850" y="306" width="340" height="16" fill="#1E4FA8"/>
    <text x="1020" y="312" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">LightCSRRanker</text>
    <line x1="850" y1="322" x2="1190" y2="322" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="860" y="346" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+model: SLM (1B-3B)</text>
    <text x="860" y="364" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+quant: str = "int4"</text>
    <text x="860" y="382" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+max_k: int = 50</text>
    <line x1="850" y1="390" x2="1190" y2="390" stroke="#D6DCE5" stroke-width="1"/>
    <text x="860" y="406" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+rank(prompt: str, cands: List[Candidate])</text>
    <text x="900" y="422" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">: List[Candidate]</text>
    <text x="860" y="438" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+explain(cand: Candidate): str</text>
  </g>

  <!-- ============ Row 3: ProfileBuilder (col A) ============ -->
  <g>
    <rect x="90" y="510" width="340" height="140" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" rx="4"/>
    <rect x="90" y="510" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="90" y="526" width="340" height="16" fill="#1E4FA8"/>
    <text x="260" y="532" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">ProfileBuilder</text>
    <line x1="90" y1="542" x2="430" y2="542" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="100" y="566" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+schema: dict</text>
    <text x="100" y="584" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+kg_store: KGStore</text>
    <text x="100" y="602" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+nl_model: T5</text>
    <line x1="90" y1="610" x2="430" y2="610" stroke="#D6DCE5" stroke-width="1"/>
    <text x="100" y="626" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+build(user_id: str): Profile</text>
    <text x="100" y="642" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+to_nl(profile: Profile): str</text>
  </g>

  <!-- ============ Row 3: KnowledgeGraphStore (col B) ============ -->
  <g>
    <rect x="470" y="510" width="340" height="140" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" rx="4"/>
    <rect x="470" y="510" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="470" y="526" width="340" height="16" fill="#1E4FA8"/>
    <text x="640" y="532" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">KnowledgeGraphStore</text>
    <line x1="470" y1="542" x2="810" y2="542" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="480" y="566" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+graph: nx.Graph</text>
    <text x="480" y="584" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+embeddings: Tensor</text>
    <text x="480" y="602" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+hop_limit: int = 2</text>
    <line x1="470" y1="610" x2="810" y2="610" stroke="#D6DCE5" stroke-width="1"/>
    <text x="480" y="626" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+query(entities: List[str], hops: int): List[Vec]</text>
    <text x="480" y="642" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+traverse(seed: Entity, k: int): List[Path]</text>
  </g>

  <!-- ============ DTO: Candidate (col C) ============ -->
  <g>
    <rect x="850" y="560" width="340" height="120" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
    <rect x="850" y="560" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="850" y="576" width="340" height="16" fill="#1E4FA8"/>
    <text x="1020" y="582" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Candidate &#171;DTO&#187;</text>
    <line x1="850" y1="592" x2="1190" y2="592" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="860" y="616" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+item_id: str</text>
    <text x="860" y="636" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+score: float</text>
    <text x="860" y="656" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+evidence: EvidenceBundle</text>
  </g>

  <!-- ============ DTO: EvidenceBundle (col C) ============ -->
  <g>
    <rect x="850" y="740" width="340" height="120" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
    <rect x="850" y="740" width="340" height="32" fill="#1E4FA8" rx="4"/>
    <rect x="850" y="756" width="340" height="16" fill="#1E4FA8"/>
    <text x="1020" y="762" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">EvidenceBundle &#171;DTO&#187;</text>
    <line x1="850" y1="772" x2="1190" y2="772" stroke="#FFFFFF" stroke-width="0.5"/>
    <text x="860" y="796" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+paths: List[Path]</text>
    <text x="860" y="816" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+rationale: str</text>
    <text x="860" y="836" fill="#1A2230" font-size="10.5" font-family="'Menlo','Consolas',monospace">+confidence: float</text>
  </g>

  <!-- ============ Relationships: native UML dependencies ============ -->

  <!-- 1. APIGateway -> ColdStartDetector : «delegate» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <path d="M 580 230 L 580 262 L 260 262 L 260 290" marker-end="url(#clDep)"/>
  </g>
  <text x="420" y="254" fill="#1A2230" font-size="10" text-anchor="middle">&#171;delegate&#187;</text>

  <!-- 2. APIGateway -> RetrievalModule : «delegate» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <line x1="640" y1="230" x2="640" y2="290" marker-end="url(#clDep)"/>
  </g>
  <text x="652" y="266" fill="#1A2230" font-size="10">&#171;delegate&#187;</text>

  <!-- 3. APIGateway -> LightCSRRanker : «delegate» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <path d="M 700 230 L 700 262 L 1020 262 L 1020 290" marker-end="url(#clDep)"/>
  </g>
  <text x="860" y="254" fill="#1A2230" font-size="10" text-anchor="middle">&#171;delegate&#187;</text>

  <!-- 4. ColdStartDetector -> RetrievalModule : «call» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <line x1="430" y1="360" x2="470" y2="360" marker-end="url(#clDep)"/>
  </g>
  <text x="450" y="350" fill="#1A2230" font-size="10" text-anchor="middle">&#171;call&#187;</text>

  <!-- 5. RetrievalModule aggregates KnowledgeGraphStore (hollow diamond) -->
  <polygon points="640,450 648,462 640,474 632,462" fill="#FFFFFF" stroke="#1A2230" stroke-width="1.2"/>
  <line x1="640" y1="474" x2="640" y2="510" stroke="#1A2230" stroke-width="1.2"/>
  <text x="630" y="486" fill="#1A2230" font-size="10" font-style="italic" text-anchor="end">index_l2</text>
  <text x="630" y="502" fill="#1A2230" font-size="10" text-anchor="end">1</text>

  <!-- 6. ProfileBuilder -> KnowledgeGraphStore : «writes» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <line x1="430" y1="580" x2="470" y2="580" marker-end="url(#clDep)"/>
  </g>
  <text x="450" y="570" fill="#1A2230" font-size="10" text-anchor="middle">&#171;writes&#187;</text>

  <!-- 7. RetrievalModule -> Candidate : «creates» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <path d="M 760 450 L 760 480 L 1020 480 L 1020 560" marker-end="url(#clDep)"/>
  </g>
  <text x="778" y="472" fill="#1A2230" font-size="10">&#171;creates&#187;</text>
  <text x="1012" y="552" fill="#1A2230" font-size="10" text-anchor="end">1</text>

  <!-- 8. RetrievalModule -> EvidenceBundle : «creates» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <path d="M 700 450 L 700 500 L 828 500 L 828 800 L 850 800" marker-end="url(#clDep)"/>
  </g>
  <text x="718" y="492" fill="#1A2230" font-size="10">&#171;creates&#187;</text>
  <text x="842" y="792" fill="#1A2230" font-size="10" text-anchor="end">1</text>

  <!-- 9. LightCSRRanker -> Candidate : «consumes» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <line x1="1060" y1="450" x2="1060" y2="560" marker-end="url(#clDep)"/>
  </g>
  <text x="1072" y="505" fill="#1A2230" font-size="10">&#171;consumes&#187;</text>
  <text x="1048" y="552" fill="#1A2230" font-size="10" text-anchor="end">*</text>

  <!-- 10. LightCSRRanker -> EvidenceBundle : «consumes» -->
  <g stroke="#1A2230" stroke-width="1.2" fill="none" stroke-dasharray="6 4">
    <path d="M 1190 400 L 1240 400 L 1240 800 L 1190 800" marker-end="url(#clDep)"/>
  </g>
  <text x="1232" y="690" fill="#1A2230" font-size="10" text-anchor="end">&#171;consumes&#187;</text>
  <text x="1182" y="792" fill="#1A2230" font-size="10" text-anchor="end">*</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(40, 900)">
    <rect x="0" y="0" width="1200" height="36" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" rx="4"/>

    <line x1="16" y1="18" x2="46" y2="18" stroke="#1A2230" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#clDep)"/>
    <text x="54" y="22" fill="#1A2230" font-size="12">dependency</text>

    <polygon points="150,18 158,11 166,18 158,25" fill="#FFFFFF" stroke="#1A2230" stroke-width="1.2"/>
    <line x1="166" y1="18" x2="196" y2="18" stroke="#1A2230" stroke-width="1.2"/>
    <text x="204" y="22" fill="#1A2230" font-size="12">aggregation</text>

    <line x1="320" y1="18" x2="350" y2="18" stroke="#1A2230" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#clDep)"/>
    <text x="358" y="22" fill="#1A2230" font-size="12">&#171;delegate&#187; / &#171;call&#187; / &#171;creates&#187; / &#171;consumes&#187;</text>

    <rect x="700" y="10" width="18" height="16" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1.5" stroke-dasharray="4 3" rx="2"/>
    <text x="726" y="22" fill="#1A2230" font-size="12">DTO (data object)</text>

    <text x="1184" y="22" fill="#8B97A8" font-size="12" text-anchor="end">LightCSR - Class - v3</text>
  </g>
</svg>
