<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" font-family="'Inter','Helvetica Neue','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="sqArrowSync" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 Z" fill="#1A2230"/>
    </marker>
    <marker id="sqArrowReturn" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#1A2230" stroke-width="1.5"/>
    </marker>
    <marker id="sqArrowBlue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 Z" fill="#1E4FA8"/>
    </marker>
    <marker id="sqArrowBlueReturn" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#1E4FA8" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1280" height="1000" fill="#FFFFFF"/>

  <!-- Title band -->
  <rect x="0" y="0" width="1280" height="56" fill="#0E3F8C"/>
  <text x="40" y="26" fill="#FFFFFF" font-size="20" font-weight="bold">LightCSR - Sequence Diagram</text>
  <text x="40" y="46" fill="#9FC3F0" font-size="13">End-to-end cold-start recommendation flow | 6 lifelines | alt branch | loop: expand + re-rank</text>

  <!-- ============ Lifeline headers ============ -->
  <g>
    <rect x="40" y="92" width="140" height="40" fill="#1E4FA8" rx="4"/>
    <text x="110" y="118" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Client</text>

    <rect x="240" y="92" width="140" height="40" fill="#1E4FA8" rx="4"/>
    <text x="310" y="118" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">API</text>

    <rect x="440" y="92" width="140" height="40" fill="#1E4FA8" rx="4"/>
    <text x="510" y="118" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Detector</text>

    <rect x="640" y="92" width="140" height="40" fill="#1E4FA8" rx="4"/>
    <text x="710" y="118" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Retrieval</text>

    <rect x="840" y="92" width="140" height="40" fill="#1E4FA8" rx="4"/>
    <text x="910" y="118" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">KGStore</text>

    <rect x="1040" y="92" width="140" height="40" fill="#1E4FA8" rx="4"/>
    <text x="1110" y="118" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Ranker</text>
  </g>

  <!-- ============ Lifelines ============ -->
  <g stroke="#8B97A8" stroke-width="1" stroke-dasharray="6 5" fill="none">
    <line x1="110" y1="132" x2="110" y2="920"/>
    <line x1="310" y1="132" x2="310" y2="920"/>
    <line x1="510" y1="132" x2="510" y2="920"/>
    <line x1="710" y1="132" x2="710" y2="920"/>
    <line x1="910" y1="132" x2="910" y2="920"/>
    <line x1="1110" y1="132" x2="1110" y2="920"/>
  </g>

  <!-- ============ alt frame (cold-start branch encloses entity_kNN call) ============ -->
  <rect x="64" y="305" width="1116" height="600" fill="none" stroke="#1E4FA8" stroke-width="1" stroke-dasharray="6 4" rx="4"/>

  <!-- ============ loop frame (encloses expand + re-rank closure) ============ -->
  <rect x="300" y="645" width="880" height="200" fill="none" stroke="#1E4FA8" stroke-width="1" stroke-dasharray="6 4" rx="4"/>

  <!-- ============ Activation boxes ============ -->
  <g fill="#E8EFF8" stroke="#1E4FA8" stroke-width="1">
    <rect x="106" y="180" width="8" height="700"/>
    <rect x="306" y="180" width="8" height="700"/>
    <rect x="506" y="230" width="8" height="50"/>
    <rect x="706" y="360" width="8" height="390"/>
    <rect x="906" y="410" width="8" height="50"/>
    <rect x="1106" y="550" width="8" height="50"/>
    <rect x="1106" y="785" width="8" height="40"/>
  </g>

  <!-- ============ Frame tags ============ -->
  <g>
    <rect x="64" y="305" width="26" height="20" fill="#1E4FA8"/>
    <text x="77" y="320" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">alt</text>
    <text x="124" y="320" fill="#1A2230" font-size="11" font-style="italic">[history &lt; 5] cold-start path</text>
    <text x="124" y="338" fill="#1A2230" font-size="11" font-style="italic">[else] standard CF - omitted</text>
  </g>
  <g>
    <rect x="320" y="640" width="30" height="20" fill="#1E4FA8"/>
    <text x="335" y="655" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">loop</text>
    <text x="362" y="655" fill="#1A2230" font-size="11" font-style="italic">[in-domain &lt; 0.8]</text>
  </g>

  <!-- ============ Messages ============ -->

  <!-- 1. Client -> API (outside alt: entry call) -->
  <line x1="110" y1="180" x2="310" y2="180" stroke="#1A2230" stroke-width="1.5" marker-end="url(#sqArrowSync)"/>
  <text x="210" y="170" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">recommend(user_id=u, query=q)</text>

  <!-- 2. API -> Detector -->
  <line x1="310" y1="230" x2="510" y2="230" stroke="#1A2230" stroke-width="1.5" marker-end="url(#sqArrowSync)"/>
  <text x="410" y="220" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">check_history(user_id=u)</text>

  <!-- 3. Detector -> API (return) -->
  <line x1="510" y1="280" x2="310" y2="280" stroke="#1A2230" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowReturn)"/>
  <text x="410" y="270" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">is_cold_start(flag=true)</text>

  <!-- 4. API -> Retrieval (retrieval path, INSIDE alt) -->
  <line x1="310" y1="360" x2="710" y2="360" stroke="#1E4FA8" stroke-width="1.5" marker-end="url(#sqArrowBlue)"/>
  <text x="510" y="350" fill="#1E4FA8" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">entity_kNN(profile=nl_profile, k=20)</text>

  <!-- 5. Retrieval -> KGStore -->
  <line x1="710" y1="410" x2="910" y2="410" stroke="#1E4FA8" stroke-width="1.5" marker-end="url(#sqArrowBlue)"/>
  <text x="810" y="400" fill="#1E4FA8" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">query(entities=ents, hops=2)</text>

  <!-- 6. KGStore -> Retrieval (return) -->
  <line x1="910" y1="460" x2="710" y2="460" stroke="#1E4FA8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowBlueReturn)"/>
  <text x="810" y="450" fill="#1E4FA8" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">vectors(n=42)</text>

  <!-- 7. Retrieval -> API (return) -->
  <line x1="710" y1="510" x2="310" y2="510" stroke="#1E4FA8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowBlueReturn)"/>
  <text x="510" y="500" fill="#1E4FA8" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">candidates(n=20, bundle=EvidenceBundle)</text>

  <!-- 8. API -> Ranker -->
  <line x1="310" y1="550" x2="1110" y2="550" stroke="#1A2230" stroke-width="1.5" marker-end="url(#sqArrowSync)"/>
  <text x="710" y="540" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">rank(prompt=p, candidates=20)</text>

  <!-- 9. Ranker -> API (return) -->
  <line x1="1110" y1="600" x2="310" y2="600" stroke="#1A2230" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowReturn)"/>
  <text x="710" y="590" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">scores(in_domain=0.62)</text>

  <!-- 10. API -> Retrieval (inside loop: expand, API is the call source) -->
  <line x1="310" y1="700" x2="710" y2="700" stroke="#1A2230" stroke-width="1.5" marker-end="url(#sqArrowSync)"/>
  <text x="510" y="690" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">expand_K(K=K+10)</text>

  <!-- 11. Retrieval -> API (loop return: expanded candidates) -->
  <line x1="710" y1="745" x2="310" y2="745" stroke="#1A2230" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowReturn)"/>
  <text x="510" y="735" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">candidates(n=30)</text>

  <!-- 12. API -> Ranker (inside loop: re-rank) -->
  <line x1="310" y1="785" x2="1110" y2="785" stroke="#1A2230" stroke-width="1.5" marker-end="url(#sqArrowSync)"/>
  <text x="710" y="775" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">re_rank(candidates=30)</text>

  <!-- 13. Ranker -> API (loop return: updated scores) -->
  <line x1="1110" y1="825" x2="310" y2="825" stroke="#1A2230" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowReturn)"/>
  <text x="710" y="815" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">scores(in_domain=0.81)</text>

  <!-- 14. API -> Client (final response, loop exited) -->
  <line x1="310" y1="875" x2="110" y2="875" stroke="#1A2230" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowReturn)"/>
  <text x="210" y="865" fill="#1A2230" font-size="11" font-family="'Menlo','Consolas',monospace" text-anchor="middle">top_K(k=10, rationale=1)</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(40, 950)">
    <rect x="0" y="0" width="1200" height="38" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" rx="4"/>

    <line x1="16" y1="20" x2="46" y2="20" stroke="#1A2230" stroke-width="1.5" marker-end="url(#sqArrowSync)"/>
    <text x="54" y="24" fill="#1A2230" font-size="12">synchronous call</text>

    <line x1="180" y1="20" x2="210" y2="20" stroke="#1A2230" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sqArrowReturn)"/>
    <text x="218" y="24" fill="#1A2230" font-size="12">return</text>

    <line x1="290" y1="20" x2="320" y2="20" stroke="#1E4FA8" stroke-width="1.5" marker-end="url(#sqArrowBlue)"/>
    <text x="328" y="24" fill="#1A2230" font-size="12">retrieval path</text>

    <rect x="440" y="12" width="16" height="16" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="1" rx="1"/>
    <text x="464" y="24" fill="#1A2230" font-size="12">activation</text>

    <line x1="560" y1="20" x2="590" y2="20" stroke="#1E4FA8" stroke-width="1" stroke-dasharray="6 4"/>
    <rect x="560" y="13" width="15" height="15" fill="#1E4FA8"/>
    <text x="600" y="24" fill="#1A2230" font-size="12">alt / loop frame</text>

    <text x="1184" y="24" fill="#8B97A8" font-size="12" text-anchor="end">LightCSR - Sequence - v3</text>
  </g>
</svg>
